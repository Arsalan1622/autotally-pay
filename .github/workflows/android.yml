name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted runners already ship a full Android SDK (ANDROID_HOME is
      # set); the setup-android action failed on the runner, so use the
      # preinstalled SDK and install anything missing via sdkmanager.
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ -z "$ANDROID_HOME" ] && [ -d /usr/lib/android-sdk ]; then
            echo "ANDROID_HOME=/usr/lib/android-sdk" >> "$GITHUB_ENV"
            ANDROID_HOME=/usr/lib/android-sdk
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found; relying on preinstalled SDK"
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > autotally-release.keystore
          printf 'storeFile=autotally-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > keystore.properties

      - name: Decode binary assets (font, icons, wrapper jar)
        run: sh tools/decode-assets.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 62 unit tests run BEFORE the APK build.
      # NOTE: testDebugUnitTest is ambiguous with two flavors; run both.
      - name: Run unit tests
        run: ./gradlew testFullDebugUnitTest testLiteDebugUnitTest --stacktrace

      # Debug APKs are signed and installable; release APKs are unsigned
      # until keystore secrets are added, so debug is the v1 deliverable.
      - name: Build APKs (full + lite, debug + release)
        run: ./gradlew assembleFullDebug assembleLiteDebug assembleFullRelease assembleLiteRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: autotally-pay-apks
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
